// Sparkplug B payload schema (subset), wire-compatible with the Eclipse Tahu
// reference `sparkplug_b.proto` (Sparkplug 3.0 / ISO/IEC 20237).
//
// Only the fields Nova reads or writes are declared. Field numbers and types
// are those of the specification, so payloads produced by real edge nodes
// (Ignition, Kepware, Tahu clients…) decode correctly; fields not declared
// here (DataSet, Template, PropertySet, MetaData…) are kept as unknown fields.
//
// Regenerate the Python module after editing (from this directory):
//   python -m grpc_tools.protoc -I. --python_out=. sparkplug_b.proto
// The same file is vendored in simulator/nova_sim/sparkplug/ — keep both in sync.
syntax = "proto2";

package org.eclipse.tahu.protobuf;

enum DataType {
  Unknown = 0;
  Int8 = 1;
  Int16 = 2;
  Int32 = 3;
  Int64 = 4;
  UInt8 = 5;
  UInt16 = 6;
  UInt32 = 7;
  UInt64 = 8;
  Float = 9;
  Double = 10;
  Boolean = 11;
  String = 12;
  DateTime = 13;
  Text = 14;
  UUID = 15;
  DataSet = 16;
  Bytes = 17;
  File = 18;
  Template = 19;
}

message Payload {
  message Metric {
    optional string name = 1;
    optional uint64 alias = 2;
    optional uint64 timestamp = 3;
    optional uint32 datatype = 4;
    optional bool is_historical = 5;
    optional bool is_transient = 6;
    optional bool is_null = 7;

    oneof value {
      uint32 int_value = 10;
      uint64 long_value = 11;
      float float_value = 12;
      double double_value = 13;
      bool boolean_value = 14;
      string string_value = 15;
      bytes bytes_value = 16;
    }
  }

  optional uint64 timestamp = 1;
  repeated Metric metrics = 2;
  optional uint64 seq = 3;
  optional string uuid = 4;
  optional bytes body = 5;
}
