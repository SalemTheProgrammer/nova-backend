[project]
name = "nova-agent-backend"
version = "0.1.0"
description = "Nova — assistant agentique de l'atelier Tunicotex (FastAPI + LangGraph)"
requires-python = ">=3.11"
# Garder synchronisé avec requirements.txt (utilisé par le Dockerfile).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.5",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "openai>=1.40.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "sqlalchemy>=2.0.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.0",
    "matplotlib>=3.9.0",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not mariadb and not divatex'"
markers = [
    "mariadb: nécessite une base MariaDB vide (NOVA_TEST_MARIADB_URL)",
    "divatex: nécessite l'accès lecture seule à la base divatex",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
